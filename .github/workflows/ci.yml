name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build all targets
        run: swift build

      - name: Run unit & integration tests
        run: swift test

      - name: Assemble signed app bundle
        run: ./Scripts/bundle-app.sh
